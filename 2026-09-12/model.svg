<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">第2课燃料芯块气隙包壳三层模型</title>
  <desc id="desc">二维轴对称燃料棒径向截面，显示燃料、等效气隙、包壳、体积热源和外表面对流。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#42cfd8"/></marker><marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0L0 4 8 8Z" fill="#294451"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#f4faf9"/>
  <text x="58" y="70" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#153746">燃料—气隙—包壳三层稳态导热</text>
  <text x="58" y="106" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#607985">轴对称 r–z 截面 · 气隙厚度为便于观察已放大，非比例绘制</text>
  <line x1="150" y1="160" x2="150" y2="570" stroke="#163c4b" stroke-width="5"/><text x="64" y="182" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#163c4b">r = 0</text>
  <rect x="150" y="190" width="330" height="330" fill="#ef8c52" stroke="#803a26" stroke-width="3"/>
  <rect x="480" y="190" width="48" height="330" fill="#fff0a8" stroke="#bc8b20" stroke-width="3"/>
  <rect x="528" y="190" width="105" height="330" fill="#91aaba" stroke="#385363" stroke-width="3"/>
  <g font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700"><text x="238" y="330" fill="#792f23">UO₂ 芯块</text><text x="220" y="365" fill="#792f23">K = 3.0 W/(m·K)</text><text x="210" y="400" fill="#792f23">HGEN = 3.0×10⁸</text><text x="506" y="450" transform="rotate(-90 506 450)" fill="#8c6510">等效气隙 K = 0.30</text><text x="558" y="370" transform="rotate(-90 558 370)" fill="#274657">包壳 K = 16.0</text></g>
  <g stroke="#42cfd8" stroke-width="4" marker-end="url(#a)"><line x1="633" y1="225" x2="715" y2="225"/><line x1="633" y1="295" x2="715" y2="295"/><line x1="633" y1="365" x2="715" y2="365"/><line x1="633" y1="435" x2="715" y2="435"/><line x1="633" y1="500" x2="715" y2="500"/></g>
  <rect x="735" y="190" width="155" height="330" rx="26" fill="#d9f3f4" stroke="#45bfc7" stroke-width="2"/><text x="773" y="325" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#126875">冷却剂</text><text x="764" y="362" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#126875">T∞ = 580 K</text><text x="758" y="394" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#126875">h = 2.0×10⁴</text>
  <g stroke="#294451" stroke-width="2" marker-start="url(#d)" marker-end="url(#d)"><line x1="150" y1="558" x2="480" y2="558"/><line x1="480" y1="590" x2="528" y2="590"/><line x1="528" y1="622" x2="633" y2="622"/></g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#294451"><text x="260" y="584">RPEL = 4.00 mm</text><text x="427" y="616">气隙 0.08 mm</text><text x="515" y="650">包壳 0.57 mm</text></g>
  <g transform="translate(935 185)" font-family="Microsoft YaHei, sans-serif"><text font-size="22" font-weight="700" fill="#153746">建模检查点</text><circle cx="8" cy="48" r="5" fill="#42cfd8"/><text x="25" y="54" font-size="17" fill="#385361">AGLUE 后核对材料分区</text><circle cx="8" cy="89" r="5" fill="#42cfd8"/><text x="25" y="95" font-size="17" fill="#385361">HGEN 只加载材料 1</text><circle cx="8" cy="130" r="5" fill="#42cfd8"/><text x="25" y="136" font-size="17" fill="#385361">CONV 只加载 RCLD</text><circle cx="8" cy="171" r="5" fill="#42cfd8"/><text x="25" y="177" font-size="17" fill="#385361">检查总发热与散热平衡</text><line x1="0" y1="212" x2="220" y2="212" stroke="#cbdcdd"/><text x="0" y="252" font-size="17" fill="#607985">主要热阻：</text><text x="0" y="286" font-size="19" font-weight="700" fill="#a97811">低导热气隙</text><text x="0" y="322" font-size="16" fill="#607985">预期在气隙处出现</text><text x="0" y="350" font-size="16" fill="#607985">较明显径向温降</text></g>
</svg>
