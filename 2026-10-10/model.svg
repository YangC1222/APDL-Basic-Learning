<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430"><rect width="980" height="430" fill="#f4f8fa"/><g font-family="Microsoft YaHei,Arial" fill="#23354a"><text x="35" y="45" font-size="24">燃料/控制棒关键参数扫描与结果批量导出</text><text x="35" y="80" font-size="16">示意图非比例；SI单位：m、W、K、Pa</text><rect x="160" y="125" width="640" height="125" fill="#f2d09a" stroke="#264a5b"/><path d="M120 300H830M120 300V100" stroke="#264a5b" stroke-width="2"/><text x="845" y="307">X / r</text><text x="100" y="95">Y / z</text><text x="190" y="155">等效棒；固定网格，五点q/k/h教学路径扫描。</text><text x="190" y="190">半径R=4 mm；长度L=40 mm；k=3→15 W/(m K)，h=10000→20000</text><text x="190" y="225">均匀HGEN热源；外表面对流 h，Tb=573 K；两端与轴线自然绝热</text><text x="35" y="350">固定节点顺序的快照与参数元数据；不含包壳、间隙或机械应力。</text><text x="35" y="390">已完成独立MAPDL求解与解析校核；教学模型适用边界见讲义。</text></g></svg>