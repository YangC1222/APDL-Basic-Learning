<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" fill="#eef5f8"/><g font-family="Microsoft YaHei" fill="#173c50"><text x="40" y="50" font-size="28">第19课：热预应力模态（非比例示意）</text><rect x="185" y="230" width="590" height="52" fill="#f4b58a" stroke="#975734" stroke-width="3"/><text x="315" y="220" font-size="22">等效矩形梁；L=0.50 m</text><path d="M185 282 l-27 44 h54 z M775 282 l-27 44 h54 z" fill="#76aabc"/><text x="45" y="363" font-size="18">左端：UX=UY=0</text><text x="658" y="363" font-size="18">右端：UX=UY=0</text><text x="305" y="315" font-size="20">两端ROTZ自由；仅XY面内弯曲</text><path d="M215 180 H320 M740 180 H640" stroke="#bb433e" stroke-width="5"/><text x="350" y="177" font-size="20">均匀升温受约束 → 热压缩</text><rect x="795" y="110" width="60" height="60" fill="#f4b58a" stroke="#975734"/><text x="710" y="94" font-size="18">截面20×20 mm</text><path d="M72 140 H155 M72 140 V75" stroke="#176e87" stroke-width="3"/><text x="162" y="146" font-size="20">X</text><text x="62" y="65" font-size="20">Y</text><text x="40" y="418" font-size="20">冷态20℃ / 热态40℃；TREF=20℃；E=190 GPa；ρ=7800 kg/m³</text><text x="40" y="457" font-size="20">α=1.2×10⁻⁵/℃；全节点UZ=ROTX=ROTY=0</text><text x="40" y="506" font-size="18">教学边界，不是实际控制棒；模态归一化形状不代表真实响应位移</text></g></svg>