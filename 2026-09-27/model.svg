<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><rect width="900" height="560" fill="#f3f8fa"/><text x="42" y="52" font-size="27" font-family="Microsoft YaHei" fill="#173f51">第17课：控制棒—导向管径向间隙（非比例绘图）</text><circle cx="300" cy="290" r="190" fill="#d8e9f0" stroke="#1b6179" stroke-width="7"/><circle cx="300" cy="290" r="171" fill="#f3f8fa" stroke="#1b6179" stroke-width="3"/><circle cx="311" cy="285" r="145" fill="#d99865" stroke="#8d4d30" stroke-width="4"/><line x1="450" y1="290" x2="473" y2="290" stroke="#c93232" stroke-width="5"/><text x="490" y="285" font-size="19" fill="#a12e2e">径向间隙 →</text><text x="518" y="340" font-size="19" fill="#173f51">控制棒外半径：5.60 mm</text><text x="518" y="376" font-size="19" fill="#173f51">导向管内半径：5.90 mm</text><text x="518" y="412" font-size="19" fill="#173f51">弯曲/偏心 0.10 mm；公差 0.05 mm</text><text x="518" y="448" font-size="19" fill="#173f51">控制棒 500–750 K；导向管 500 K</text><text x="46" y="535" font-size="18" fill="#526c75">示例只做自由热膨胀的几何初筛；未求接触压力与插入力。</text></svg>