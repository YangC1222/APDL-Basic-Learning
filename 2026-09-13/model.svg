<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">第3课燃料芯块体积热源与包壳对流模型</title>
  <desc id="desc">二维轴对称燃料棒模型，燃料和包壳理想结合，燃料施加体积热源，包壳外表面施加冷却剂对流。</desc>
  <defs><linearGradient id="f" x1="0" x2="1"><stop stop-color="#ffd06a"/><stop offset="1" stop-color="#e97047"/></linearGradient><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#42cfd8"/></marker><marker id="d3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 0L0 4 8 8Z" fill="#294451"/></marker><pattern id="m3" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".28"/></pattern></defs>
  <rect width="1200" height="720" rx="28" fill="#f4faf9"/>
  <text x="58" y="70" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#153746">燃料芯块体积热源 + 包壳外表面对流</text><text x="58" y="106" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#607985">PLANE55 · 轴对称稳态热分析 · 理想结合 · 示意图非比例</text>
  <line x1="150" y1="150" x2="150" y2="575" stroke="#163c4b" stroke-width="5"/><text x="62" y="176" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#163c4b">轴线 r = 0</text>
  <rect x="150" y="185" width="350" height="345" fill="url(#f)" stroke="#803a26" stroke-width="3"/><rect x="150" y="185" width="350" height="345" fill="url(#m3)"/>
  <rect x="500" y="185" width="92" height="345" fill="#91aaba" stroke="#385363" stroke-width="3"/><rect x="500" y="185" width="92" height="345" fill="url(#m3)"/>
  <line x1="500" y1="185" x2="500" y2="530" stroke="#f7f4d5" stroke-width="6" stroke-dasharray="12 7"/><text x="468" y="153" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#765b13">理想结合界面</text>
  <g font-family="Microsoft YaHei, sans-serif" font-weight="700"><text x="250" y="332" font-size="23" fill="#752f24">UO₂ 燃料</text><text x="220" y="368" font-size="18" fill="#752f24">q''' = 2.0×10⁸ W/m³</text><text x="220" y="400" font-size="17" fill="#752f24">K = 3.0 W/(m·K)</text><text x="535" y="400" transform="rotate(-90 535 400)" font-size="18" fill="#274657">包壳 K = 16.0</text></g>
  <g stroke="#42cfd8" stroke-width="4" marker-end="url(#a3)"><line x1="592" y1="220" x2="682" y2="220"/><line x1="592" y1="290" x2="682" y2="290"/><line x1="592" y1="360" x2="682" y2="360"/><line x1="592" y1="430" x2="682" y2="430"/><line x1="592" y1="500" x2="682" y2="500"/></g>
  <rect x="705" y="185" width="170" height="345" rx="26" fill="#d9f3f4" stroke="#45bfc7" stroke-width="2"/><text x="747" y="315" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#126875">冷却剂</text><text x="736" y="354" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#126875">T∞ = 570 K</text><text x="730" y="386" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#126875">h = 2.5×10⁴</text><text x="740" y="414" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#126875">W/(m²·K)</text>
  <g stroke="#294451" stroke-width="2" marker-start="url(#d3)" marker-end="url(#d3)"><line x1="150" y1="570" x2="500" y2="570"/><line x1="500" y1="610" x2="592" y2="610"/><line x1="112" y1="185" x2="112" y2="530"/></g>
  <g font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#294451"><text x="255" y="597">r_fuel = 4.10 mm</text><text x="469" y="638">包壳厚度 = 0.65 mm</text><text x="52" y="390" transform="rotate(-90 52 390)">建模长度 = 0.10 m</text></g>
  <g transform="translate(920 185)" font-family="Microsoft YaHei, sans-serif"><text font-size="22" font-weight="700" fill="#153746">载荷与选择集</text><text y="48" font-size="17" fill="#385361">① ESEL,MAT,1</text><text y="79" font-size="16" fill="#607985">只选燃料单元</text><text y="119" font-size="17" fill="#385361">② BFE,HGEN,qvol</text><text y="150" font-size="16" fill="#607985">施加体积热源</text><text y="190" font-size="17" fill="#385361">③ LSEL,X,r_clad</text><text y="221" font-size="16" fill="#607985">只选包壳外壁</text><text y="261" font-size="17" fill="#385361">④ SFL,CONV,h,T∞</text><line x1="0" y1="296" x2="220" y2="296" stroke="#cbdcdd"/><text y="337" font-size="17" fill="#607985">结果核查</text><text y="370" font-size="18" font-weight="700" fill="#b44a32">Tmax 位于中心线附近</text><text y="404" font-size="16" fill="#607985">升高 qvol → Tmax 上升</text><text y="434" font-size="16" fill="#607985">升高 h → 外壁膜温差下降</text></g>
</svg>
