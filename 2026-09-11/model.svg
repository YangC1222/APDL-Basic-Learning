<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">第1课二维轴对称燃料芯块模型</title>
  <desc id="desc">UO2燃料芯块半截面，包含体积热源、外圆周对流边界、轴对称轴和主要尺寸。</desc>
  <defs>
    <linearGradient id="fuel" x1="0" x2="1"><stop stop-color="#ffca64"/><stop offset="1" stop-color="#e96d45"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6Z" fill="#46d7df"/></marker>
    <marker id="dim" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8,0 L0,4 L8,8Z" fill="#243f50"/></marker>
    <pattern id="mesh" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f4faf9"/>
  <text x="64" y="72" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#153746">二维轴对称 UO₂ 燃料芯块</text>
  <text x="64" y="108" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#607985">PLANE55 · 稳态导热 · SI 单位制 · 示意图非比例</text>
  <line x1="185" y1="160" x2="185" y2="585" stroke="#173b4a" stroke-width="5"/>
  <text x="80" y="180" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#173b4a">轴线 r = 0</text>
  <rect x="185" y="190" width="360" height="340" rx="3" fill="url(#fuel)" stroke="#743d2a" stroke-width="3"/>
  <rect x="185" y="190" width="360" height="340" fill="url(#mesh)"/>
  <g fill="#7b2f25" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700">
    <text x="286" y="336">UO₂ 燃料芯块</text><text x="270" y="370">材料 1：KXX = 2.8</text><text x="252" y="404">HGEN = 3.0×10⁸ W/m³</text>
  </g>
  <g stroke="#46d7df" stroke-width="4" marker-end="url(#arrow)">
    <line x1="545" y1="230" x2="625" y2="230"/><line x1="545" y1="300" x2="625" y2="300"/><line x1="545" y1="370" x2="625" y2="370"/><line x1="545" y1="440" x2="625" y2="440"/><line x1="545" y1="500" x2="625" y2="500"/>
  </g>
  <rect x="650" y="190" width="190" height="340" rx="28" fill="#d8f3f4" stroke="#46bfc7" stroke-width="2"/>
  <text x="683" y="322" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#116874">冷却剂</text>
  <text x="681" y="358" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#116874">T∞ = 580 K</text>
  <text x="675" y="390" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#116874">h = 2.0×10⁴</text>
  <text x="684" y="418" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#116874">W/(m²·K)</text>
  <line x1="185" y1="570" x2="545" y2="570" stroke="#243f50" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="305" y="605" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#243f50">RPEL = 4.0 mm</text>
  <line x1="145" y1="190" x2="145" y2="530" stroke="#243f50" stroke-width="2" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="82" y="380" transform="rotate(-90 82 380)" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#243f50">LPEL = 10 mm</text>
  <g transform="translate(905 225)" font-family="Microsoft YaHei, sans-serif">
    <text x="0" y="0" font-size="22" font-weight="700" fill="#153746">APDL 对应关系</text>
    <text x="0" y="48" font-size="17" fill="#385361">矩形截面：RECTNG</text><text x="0" y="82" font-size="17" fill="#385361">轴对称：KEYOPT,1,3,1</text><text x="0" y="116" font-size="17" fill="#385361">体积热源：BFE,HGEN</text><text x="0" y="150" font-size="17" fill="#385361">外壁对流：SFL,CONV</text>
    <line x1="0" y1="190" x2="220" y2="190" stroke="#cbdcdd"/>
    <text x="0" y="230" font-size="16" fill="#607985">温度预期：</text><text x="0" y="262" font-size="17" font-weight="700" fill="#ba4a32">中心高 → 外壁低</text>
  </g>
  <g transform="translate(930 575)" stroke="#173b4a" stroke-width="3" marker-end="url(#arrow)"><line x1="0" y1="40" x2="80" y2="40"/><line x1="0" y1="40" x2="0" y2="-38"/></g>
  <text x="1020" y="622" font-family="sans-serif" font-size="18" fill="#173b4a">r (X)</text><text x="910" y="528" font-family="sans-serif" font-size="18" fill="#173b4a">z (Y)</text>
</svg>
