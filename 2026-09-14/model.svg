<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">第4课温度相关燃料棒材料模型</title>
  <desc id="desc">轴对称UO2燃料和包壳模型，旁边绘制导热率随温度变化的材料曲线与冷却剂表参数。</desc>
  <defs>
    <linearGradient id="fuel4" x1="0" x2="1"><stop stop-color="#ffd978"/><stop offset="1" stop-color="#ea6b4d"/></linearGradient>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6Z" fill="#31b9c5"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f4faf9"/>
  <text x="55" y="65" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700" fill="#163846">温度相关物性：UO₂—包壳—冷却剂</text>
  <text x="55" y="101" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#607985">PLANE55 · 轴对称稳态热分析 · MPTEMP + MPDATA + TABLE · 示意图非比例</text>
  <line x1="105" y1="165" x2="105" y2="545" stroke="#163846" stroke-width="5"/>
  <text x="47" y="148" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#163846">r = 0</text>
  <rect x="105" y="190" width="290" height="320" fill="url(#fuel4)" stroke="#883f2c" stroke-width="3"/>
  <rect x="395" y="190" width="76" height="320" fill="#91aabb" stroke="#385565" stroke-width="3"/>
  <text x="190" y="322" font-family="Microsoft YaHei,sans-serif" font-size="23" font-weight="700" fill="#712e25">UO₂ 燃料</text>
  <text x="169" y="360" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#712e25">K(T)：7.5 → 2.5</text>
  <text x="435" y="410" transform="rotate(-90 435 410)" font-family="Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#294957">包壳 K(T)：13.5 → 21.0</text>
  <g stroke="#31b9c5" stroke-width="4" marker-end="url(#arr4)"><line x1="471" y1="230" x2="540" y2="230"/><line x1="471" y1="315" x2="540" y2="315"/><line x1="471" y1="400" x2="540" y2="400"/><line x1="471" y1="485" x2="540" y2="485"/></g>
  <rect x="553" y="190" width="152" height="320" rx="24" fill="#d9f3f4" stroke="#46bdc5" stroke-width="2"/>
  <text x="585" y="302" font-family="Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#126875">冷却剂</text>
  <text x="580" y="343" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#126875">T∞ = 600 K</text>
  <text x="576" y="378" font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#126875">h = hcool(T)</text>
  <text x="574" y="414" font-family="Microsoft YaHei,sans-serif" font-size="15" fill="#126875">TABLE 参数插值</text>
  <g transform="translate(755 165)" font-family="Microsoft YaHei,sans-serif">
    <rect x="0" y="0" width="385" height="415" rx="18" fill="#fff" stroke="#cfdddd"/>
    <text x="24" y="40" font-size="21" font-weight="700" fill="#163846">材料表插值示意</text>
    <line x1="58" y1="342" x2="340" y2="342" stroke="#516c77" stroke-width="2"/>
    <line x1="58" y1="342" x2="58" y2="82" stroke="#516c77" stroke-width="2"/>
    <text x="308" y="374" font-size="15" fill="#516c77">温度 T</text>
    <text x="17" y="93" font-size="15" fill="#516c77">K(T)</text>
    <polyline points="78,108 135,162 192,205 249,244 312,278" fill="none" stroke="#df664b" stroke-width="5"/>
    <polyline points="78,286 135,267 192,241 249,214 312,188" fill="none" stroke="#3c6f94" stroke-width="5"/>
    <g fill="#df664b"><circle cx="78" cy="108" r="5"/><circle cx="135" cy="162" r="5"/><circle cx="192" cy="205" r="5"/><circle cx="249" cy="244" r="5"/><circle cx="312" cy="278" r="5"/></g>
    <g fill="#3c6f94"><circle cx="78" cy="286" r="5"/><circle cx="135" cy="267" r="5"/><circle cx="192" cy="241" r="5"/><circle cx="249" cy="214" r="5"/><circle cx="312" cy="188" r="5"/></g>
    <text x="207" y="120" font-size="16" font-weight="700" fill="#df664b">UO₂：随 T 降低</text>
    <text x="208" y="177" font-size="16" font-weight="700" fill="#3c6f94">包壳：随 T 升高</text>
    <text x="70" y="365" font-size="13" fill="#607985">300</text><text x="178" y="365" font-size="13" fill="#607985">900</text><text x="294" y="365" font-size="13" fill="#607985">1500 K</text>
  </g>
  <g font-family="Microsoft YaHei,sans-serif" fill="#294957"><text x="90" y="581" font-size="16">燃料半径 4.10 mm</text><text x="335" y="581" font-size="16">包壳外半径 4.75 mm</text><text x="94" y="628" font-size="17" font-weight="700">求解后必须核查 Tmin、Tmax 是否在 300–1500 K 数据范围内</text><text x="94" y="660" font-size="15" fill="#607985">教学数据用于演示命令；工程模型需采用与材料牌号、温度、辐照状态匹配的验证数据。</text></g>
</svg>
