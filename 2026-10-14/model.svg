<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570"><rect width="1100" height="570" fill="#f5f8fc"/><g font-family="Microsoft YaHei,Arial" fill="#23384d"><text x="40" y="55" font-size="27">第32课 · 热膨胀间隙接触与模型简化</text><text x="40" y="95" font-size="17">SI单位；均匀规定温度；一维小应变示例，非比例绘图</text><rect x="80" y="195" width="45" height="125" fill="#7894a4"/><rect x="125" y="235" width="535" height="45" fill="#eac280"/><rect x="775" y="180" width="70" height="155" fill="#7894a4"/><circle cx="125" cy="258" r="7" fill="#18384d"/><circle cx="660" cy="258" r="7" fill="#18384d"/><circle cx="775" cy="258" r="7" fill="#18384d"/><path d="M667 258H768" stroke="#ce5848" stroke-width="4" stroke-dasharray="10 5"/><text x="140" y="210" font-size="20">LINK180：L=0.1 m；A=10 mm²</text><text x="175" y="312" font-size="19">E=200 GPa；α=10⁻⁵/K（教学值）</text><text x="55" y="357" font-size="18">节点1 固定</text><text x="605" y="390" font-size="18">节点2 可沿X位移</text><text x="790" y="357" font-size="18">节点3 固定</text><text x="638" y="155" font-size="19">CONTA178；g₀=20 μm</text><text x="625" y="185" font-size="17">纯罚函数、无摩擦、保留开闭</text><path d="M135 430H385" stroke="#18384d" stroke-width="2"/><path d="M385 430l-12 -6v12Z" fill="#18384d"/><text x="395" y="437" font-size="18">X</text><text x="45" y="485" font-size="18">Tref=293 K；升温10 K → 40 K → 冷却0 K；分别核对间隙、反力与接触状态</text><text x="45" y="525" font-size="17">比较罚刚度及零间隙绑定替代；不模拟三维弯曲、面接触、摩擦卡涩和导热</text></g></svg>