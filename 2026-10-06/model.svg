<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430"><rect width="980" height="430" fill="#f4f8fa"/><g font-family="Microsoft YaHei,Arial" fill="#23354a"><text x="35" y="45" font-size="24">第25课补充A：自由热膨胀与最小约束</text><text x="35" y="80" font-size="16">示意图非比例；SI单位：m、W、K、Pa</text><rect x="160" y="125" width="640" height="125" fill="#f2d09a" stroke="#264a5b"/><path d="M120 300H830M120 300V100" stroke="#264a5b" stroke-width="2"/><text x="845" y="307">X（杆轴）</text><text x="100" y="95">Y</text><text x="190" y="155">等效结构杆、均匀给定温度；左端轴向固定，右端自由。</text><text x="190" y="190">长度L=1 m，截面积A=1e-4 m²；E=200 GPa，α=1e-5/K，ΔT=100 K</text><text x="190" y="225">左端UX=0；全部节点UY/UZ=0；右端UX自由；TREF=293 K，T=393 K</text><text x="35" y="350">结构验证：自由热膨胀与完全约束轴向反力；不含流体或接触。</text><text x="35" y="390">已完成独立MAPDL求解与解析校核；教学模型适用边界见讲义。</text></g></svg>