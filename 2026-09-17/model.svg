<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" role="img" aria-label="燃料棒包壳轴对称模型：内半径4.10毫米、外半径4.75毫米、长度100毫米；自由和两端轴向约束工况">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#176e82" stroke-width="2"/></marker><linearGradient id="metal" x2="1" y2="0"><stop stop-color="#5db9c3"/><stop offset="1" stop-color="#aedfe0"/></linearGradient></defs>
<rect width="980" height="590" rx="24" fill="#f6faf9"/><text x="48" y="56" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="bold" fill="#103d49">第7课 受约束包壳的热膨胀与热应力</text>
<text x="48" y="88" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#54717b">二维轴对称 r-z 截面 · 非比例示意 · SI 单位</text>
<line x1="110" y1="120" x2="110" y2="500" stroke="#6a9aa3" stroke-dasharray="7 6" stroke-width="2"/><text x="65" y="116" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#356a76">轴线 r=0</text>
<rect x="300" y="137" width="122" height="348" fill="url(#metal)" stroke="#176e82" stroke-width="3"/><text x="311" y="315" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#123e48">包壳</text>
<line x1="110" y1="513" x2="300" y2="513" stroke="#176e82" stroke-width="2" marker-end="url(#arrow)"/><text x="150" y="540" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#176e82">rᵢ = 4.10 mm</text>
<line x1="110" y1="555" x2="422" y2="555" stroke="#176e82" stroke-width="2" marker-end="url(#arrow)"/><text x="240" y="580" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#176e82">rₒ = 4.75 mm</text>
<line x1="463" y1="137" x2="463" y2="485" stroke="#176e82" stroke-width="2" marker-end="url(#arrow)"/><text x="474" y="315" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#176e82">L = 100 mm</text>
<text x="271" y="126" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#0b6274">顶部位移测点 ●</text><circle cx="422" cy="137" r="6" fill="#bd782b"/>
<circle cx="300" cy="485" r="6" fill="#bd782b"/><text x="190" y="488" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#87501d">基准点</text>
<rect x="548" y="129" width="378" height="174" rx="17" fill="#e8f4f2" stroke="#bfdbd9"/><text x="572" y="166" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="bold" fill="#0c606a">A · 自由热膨胀</text><text x="572" y="203" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#244b53">仅基准点 UY = 0；其余径向、轴向自由</text><text x="572" y="237" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#244b53">TREF = 580 K → TEMP = 650 K</text><text x="572" y="273" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#376a70">比较顶部 UY 与 αΔTL 的量级</text>
<rect x="548" y="325" width="378" height="188" rx="17" fill="#fff2df" stroke="#ead3b4"/><text x="572" y="365" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="bold" fill="#9b591a">B · 两端轴向受约束</text><text x="572" y="404" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#5c4c3a">上下端面全部节点 UY = 0</text><text x="572" y="439" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#5c4c3a">径向 UX 自由；温度和网格与 A 相同</text><text x="572" y="478" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#8a632d">比较中段应力、总反力及网格收敛</text>
<text x="51" y="482" font-family="Microsoft YaHei, sans-serif" font-size="14" fill="#526c75">中空区域</text>
</svg>
