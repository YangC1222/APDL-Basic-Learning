<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img" aria-label="控制棒等效梁谐响应模型示意图"><rect width="1100" height="570" fill="#edf5f7"/><text x="42" y="56" font-family="Microsoft YaHei" font-size="29" fill="#183f54">第20课 · 控制棒—导向管等效横向谐响应</text><text x="42" y="89" font-family="Microsoft YaHei" font-size="16" fill="#536e7b">不按比例绘制；均质梁和简化铰支仅供命令教学</text><line x1="150" y1="286" x2="940" y2="286" stroke="#287e98" stroke-width="27"/><text x="410" y="266" font-family="Microsoft YaHei" font-size="22" fill="#123f54">BEAM188 等效控制棒 / 导向管</text><polygon points="150,302 122,342 178,342" fill="#c78632"/><polygon points="940,302 912,342 968,342" fill="#c78632"/><line x1="125" y1="348" x2="175" y2="348" stroke="#664d31" stroke-width="5"/><line x1="915" y1="348" x2="965" y2="348" stroke="#664d31" stroke-width="5"/><path d="M545 165 V248" stroke="#b34139" stroke-width="7"/><polygon points="545,263 532,239 558,239" fill="#b34139"/><text x="563" y="181" font-family="Microsoft YaHei" font-size="19" fill="#9b342e">中点 Fᵧ=10 N（谐波幅值）</text><line x1="150" y1="380" x2="940" y2="380" stroke="#31556b" stroke-width="2"/><path d="M150 370 V390 M940 370 V390" stroke="#31556b" stroke-width="2"/><text x="454" y="411" font-family="Microsoft YaHei" font-size="19" fill="#24475d">L = 0.50 m</text><text x="80" y="468" font-family="Microsoft YaHei" font-size="17" fill="#344f60">截面：20 × 20 mm；E=190 GPa；ρ=7800 kg/m³；教学阻尼比2%</text><text x="80" y="507" font-family="Microsoft YaHei" font-size="17" fill="#344f60">扫频20–300 Hz，提取中点Y位移幅值；未计真实流体附加质量、接触与阻尼</text></svg>