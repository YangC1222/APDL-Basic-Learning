<svg xmlns="http://www.w3.org/2000/svg" width="940" height="540" viewBox="0 0 940 540"><rect width="940" height="540" fill="#f1f7fa"/><g font-family="Microsoft YaHei" fill="#143d51"><text x="38" y="48" font-size="27">第18课：局部摩擦接触（非比例绘图）</text><rect x="200" y="210" width="430" height="155" fill="#e0b18a" stroke="#8e4d2e" stroke-width="3"/><text x="225" y="288" font-size="21">弹性接触块：E=190 GPa，ν=0.30</text><path d="M160 386 H690" stroke="#156f88" stroke-width="8"/><text x="205" y="438" font-size="20">刚性导向面，UX=UY=0；目标段右→左</text><path d="M200 177 H630" stroke="#c74940" stroke-width="4"/><text x="310" y="166" font-size="20">第二步：沿X滑移2 mm →</text><path d="M400 110 V198" stroke="#c74940" stroke-width="4"/><text x="485" y="125" font-size="19">第一步：法向闭合间隙 + 压入1 μm</text><text x="695" y="373" font-size="19">初始间隙0.10 mm</text><text x="205" y="333" font-size="18">接触μ=0.20；长20 mm、厚5 mm</text><text x="38" y="500" font-size="18">X：局部插入方向；Y：法向；二维平面应变，反力按单位出平面宽度解释</text></g></svg>